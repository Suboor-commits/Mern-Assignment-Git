
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student Registration Form - Abdul Suboor Khan">
  <title>Student Registration - Abdul Suboor Khan</title>
</head>

<body>

  <header>
    <h1>Student Registration Form</h1>
    <p>Created by Abdul Suboor Khan | First-Year BCAI Student</p>
  </header>

  <main>
    <form action="#" method="post">

      <p>
        <label for="name">Full Name:</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          placeholder="Abdul Suboor Khan">
      </p>

      <p>
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="your-email@example.com">
      </p>

      <p>
        <label for="phone">Phone:</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          pattern="[0-9]{10}"
          placeholder="10 digits"
          title="Enter a 10-digit phone number">
      </p>

      <p>
        <label for="pass">Password:</label>
        <input
          type="password"
          id="pass"
          name="password"
          minlength="8"
          required
          placeholder="Minimum 8 characters">
      </p>

      <fieldset>
        <legend>Gender</legend>

        <label>
          <input type="radio" name="gender" value="male">
          Male
        </label>

        <label>
          <input type="radio" name="gender" value="female">
          Female
        </label>

        <label>
          <input type="radio" name="gender" value="other">
          Other
        </label>
      </fieldset>

      <p>
        <label for="course">Course:</label>
        <select id="course" name="course" required>
          <option value="">-- Select Course --</option>
          <option value="BCAI">BCAI</option>
          <option value="BCA">BCA</option>
          <option value="BTech-CSE">B.Tech CSE</option>
          <option value="BSc-IT">B.Sc IT</option>
        </select>
      </p>

      <p>
        <label for="year">Academic Year:</label>
        <select id="year" name="year" required>
          <option value="">-- Select Year --</option>
          <option value="first">First Year</option>
          <option value="second">Second Year</option>
          <option value="third">Third Year</option>
        </select>
      </p>

      <p>
        <label>
          <input type="checkbox" name="terms" required>
          I agree to the terms and conditions.
        </label>
      </p>

      <button type="submit">Register</button>
      <button type="reset">Clear Form</button>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Abdul Suboor Khan</p>
  </footer>

</body>
</html>
